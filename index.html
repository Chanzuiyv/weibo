                // ----- 快照图片：去重持久化到用户目录 fav_images/ -----
                // ===== v3.1 媒体持久化（图片/视频统一：跨成员/年份 + 导入导出可靠）=====
                const VIDEO_EXTS = ['mp4','mov','m4v','webm','ogv','avi','mkv','flv','ts','3gp'];
                async function favImagesDir() { return ensureDirectory(appState.userDirHandle, 'fav_images'); }
                async function favVideosDir() { return ensureDirectory(appState.userDirHandle, 'fav_videos'); }

                function mimeToExt(mime, fallback) {
                    const m = String(mime || '').split('/')[1] || '';
                    if (!m) return fallback;
                    let e = m.replace('jpeg','jpg').replace('svg+xml','svg').replace('quicktime','mov').replace('x-matroska','mkv');
                    return e.split(';')[0].trim() || fallback;
                }
                // v4：媒体一律进 IndexedDB 私有存储（按内容哈希去重）
                async function writeMediaBlob(buf, kind, ext) {
                    const safeExt = ext || (kind === 'video' ? 'mp4' : 'jpg');
                    const mime = kind === 'video'
                        ? ('video/' + (safeExt === 'mkv' ? 'x-matroska' : safeExt === 'mov' ? 'quicktime' : safeExt === 'webm' ? 'webm' : 'mp4'))
                        : ('image/' + (safeExt === 'jpg' ? 'jpeg' : safeExt === 'svg' ? 'svg+xml' : safeExt));
                    const blob = new Blob([buf], { type: mime });
                    const mediaId = await IDB.mediaBlobPut(blob, safeExt);
                    return { t: 'id', mediaId };
                }

                // 从磁盘业务目录解析文件（filePath 可能是完整绝对路径或相对路径，分隔符 \ 或 /）
                async function resolveBusinessFile(filePath, kind) {
                    if (!filePath || !appState.rootDirHandle) return null;
                    const rawParts = String(filePath).split(/[\\/]/).filter(Boolean);
                    const fileName = rawParts[rawParts.length - 1];
                    const rootName = appState.rootDirHandle.name;

                    // 候选基目录：根目录本身；两个业务结构下的「成员/年份」目录
                    const bases = [{ h: appState.rootDirHandle, strip: 0 }];
                    for (const b of ['成员微博整理_新版', '成员微博整理']) {
                        try {
                            let dd = await appState.rootDirHandle.getDirectoryHandle(b, { create: false });
                            dd = await dd.getDirectoryHandle(appState.member, { create: false });
                            dd = await dd.getDirectoryHandle(String(appState.year), { create: false });
                            bases.push({ h: dd, rootBase: b });
                        } catch (e) {}
                    }

                    const tryResolve = async (baseHandle, parts) => {
                        let h = baseHandle;
                        for (let i = 0; i < parts.length - 1; i++) {
                            h = await h.getDirectoryHandle(parts[i], { create: false });
                        }
                        const fh = await h.getFileHandle(parts[parts.length - 1], { create: false });
                        return await fh.getFile();
                    };

                    for (const base of bases) {
                        let parts = rawParts.slice();
                        // 去掉开头的根目录名
                        if (parts[0] === rootName) parts = parts.slice(1);
                        if (base.rootBase) {
                            // 基目录已是「成员/年份」：剥掉 业务根/成员/年份 前缀
                            const idx = parts.indexOf(base.rootBase);
                            if (idx >= 0) parts = parts.slice(idx + 3);
                        }
                        if (!parts.length || parts[parts.length-1] !== fileName) continue;
                        try { const f = await tryResolve(base.h, parts); if (f) return f; } catch (e) {}
                    }

                    // 视频固定结构兜底：成员微博整理_新版/成员/年份/videos/weiboId/文件名
                    if (kind === 'video') {
                        try {
                            const wIds = kind === 'video' ? null : null;
                            let dd = appState.rootDirHandle;
                            dd = await dd.getDirectoryHandle('成员微博整理_新版', { create: false });
                            dd = await dd.getDirectoryHandle(appState.member, { create: false });
                            dd = await dd.getDirectoryHandle(String(appState.year), { create: false });
                            dd = await dd.getDirectoryHandle('videos', { create: false });
                            // 在所有 weiboId 子目录里找该文件名
                            for await (const [, sub] of dd.entries()) {
                                if (sub.kind !== 'directory') continue;
                                try { const fh = await sub.getFileHandle(fileName, { create: false }); return await fh.getFile(); } catch (e) {}
                            }
                        } catch (e) {}
                    }
                    return null;
                }

                // 尝试把远程 URL 拉成可存储的二进制（cors；失败则 null）
                async function tryFetchRemote(urlStr) {
                    try {
                        const r = await fetch(urlStr, { mode: 'cors', credentials: 'omit' });
                        if (!r.ok) return null;
                        const blob = await r.blob();
                        if (!blob.size || blob.type.includes('json') || blob.type.includes('html')) return null;
                        return blob;
                    } catch (e) { return null; }
                }
                async function tryFetchBlobUrl(u) {
                    try {
                        const r = await fetch(u);
                        if (!r.ok) return null;
                        return await r.blob();
                    } catch (e) { return null; }
                }

                async function persistMedia(media, kind) {
                    if (!media) return null;
                    let dataUrl = '', blobUrl = '', filePath = '', urlStr = '', fileNameHint = '';
                    if (typeof media === 'object') {
                        dataUrl = media.base64 || '';
                        blobUrl = media.blobUrl || '';
                        filePath = media.filePath || '';
                        urlStr = media.url || '';
                        fileNameHint = media.fileName || '';
                        if (blobUrl.startsWith('data:')) { dataUrl = dataUrl || blobUrl; blobUrl = ''; }
                        if (filePath.startsWith('data:')) { dataUrl = dataUrl || filePath; filePath = ''; }
                        if (filePath.startsWith('blob:')) { blobUrl = blobUrl || filePath; filePath = ''; }
                        if (filePath.startsWith('http')) { urlStr = urlStr || filePath; filePath = ''; }
                    } else if (typeof media === 'string') {
                        const s = media;
                        if (s.startsWith('data:')) dataUrl = s;
                        else if (s.startsWith('blob:')) blobUrl = s;
                        else if (s.startsWith('http')) urlStr = s;
                        else filePath = s;
                    }

                    const guessExt = () => {
                        const fromName = (fileNameHint || filePath || urlStr).match(/\.([a-zA-Z0-9]{2,4})$/);
                        if (fromName) return fromName[1].toLowerCase();
                        return kind === 'video' ? 'mp4' : 'jpg';
                    };

                    // 1) data URL
                    if (dataUrl) {
                        const mm = dataUrl.match(/^data:([\w/+.-]+)?;base64,(.*)$/);
                        let b64 = dataUrl, mime = kind === 'video' ? 'video/mp4' : 'image/jpeg';
                        if (mm) { mime = mm[1] || mime; b64 = mm[2]; }
                        try {
                            const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer;
                            return await writeMediaBlob(bin, kind, mimeToExt(mime, guessExt()));
                        } catch (e) {}
                    }

                    // 2) blob: URL（页面正在显示的媒体，同 session 内可直接取二进制）
                    if (blobUrl && blobUrl.startsWith('blob:')) {
                        const blob = await tryFetchBlobUrl(blobUrl);
                        if (blob && blob.size) {
                            const ext = mimeToExt(blob.type, guessExt());
                            if (kind === 'video' && blob.type.startsWith('image/')) {} // 类型不符仍按实际存
                            return await writeMediaBlob(await blob.arrayBuffer(), kind, ext);
                        }
                    }

                    // 3) 磁盘业务文件（剥绝对路径前缀后逐级解析）
                    if (filePath) {
                        const f = await resolveBusinessFile(filePath, kind);
                        if (f && f.size) {
                            return await writeMediaBlob(await f.arrayBuffer(), kind, mimeToExt(f.type, guessExt()));
                        }
                    }

                    // 4) 远程 URL：尝试 CORS 拉取存盘；失败则保留 URL 引用（可能被浏览器跨域策略拦截）
                    if (urlStr) {
                        const blob = await tryFetchRemote(urlStr);
                        if (blob && blob.size) {
                            return await writeMediaBlob(await blob.arrayBuffer(), kind, mimeToExt(blob.type, guessExt()));
                        }
                        return { t: 'u', v: urlStr };
                    }
                    return null;
                }
                const persistImage = img => persistMedia(img, 'image');
                const persistVideo = v => persistMedia(v, 'video');

                async function hydrateSnapshotImages() {
                    appState.snapshotUrlMap = {};
                    const ids = {};
                    const collect = list => (list || []).forEach(it => {
                        (it.images || []).forEach(im => { if (im && im.t === 'id') ids[im.mediaId] = 1; });
                        (it.videos || []).forEach(vd => { if (vd && vd.t === 'id') ids[vd.mediaId] = 1; });
                    });
                    appState.userData.favorites.folders.forEach(f => collect(f.items));
                    collect(appState.userData.likes.items);
                    for (const id of Object.keys(ids)) {
                        try {
                            const blob = await IDB.mediaGet(id);
                            if (blob) appState.snapshotUrlMap[id] = URL.createObjectURL(blob);
                        } catch (e) {}
                    }
                }
                function snapshotImageUrl(im) {
                    if (!im) return '';
                    if (im.t === 'id') return appState.snapshotUrlMap[im.mediaId] || '';
                    return im.v || '';
                }

                // ----- 快照构建（跨成员/年份仍可在收藏夹内查看）-----
                function findWeiboById(id) { return appState.weiboData.data.find(w => String(w.weiboId) === String(id)); }
                function findCommentById(id) { return appState.commentData.data.find(c => String(c.commentId) === String(id)); }
                async function buildWeiboSnapshot(w) {
                    const imgs = [];
                    for (const im of (w.images || [])) { const p = await persistImage(im); if (p) imgs.push(p); }
                    const vids = [];
                    for (const vd of (w.videos || [])) { const p = await persistVideo(vd); if (p) vids.push(p); }
                    return {
                        itemType: 'weibo', sourceKey: currentSourceKey(),
                        member: appState.member, year: String(appState.year),
                        itemId: String(w.weiboId),
                        url: w.url || ('https://m.weibo.cn/detail/' + w.weiboId),
                        date: w.date || '', author: appState.member,
                        content: w.content || '', images: imgs, videos: vids, hasVideo: vids.length > 0
                    };
                }
                async function buildCommentSnapshot(c) {
                    const imgs = [];
                    for (const im of (c.images || [])) { const p = await persistImage(im); if (p) imgs.push(p); }
                    const parent = findWeiboById(c.weiboId);
                    return {
                        itemType: 'comment', sourceKey: currentSourceKey(),
                        member: appState.member, year: String(appState.year),
                        itemId: String(c.commentId), weiboId: String(c.weiboId),
                        url: c.viaUrl || ('https://m.weibo.cn/detail/' + c.weiboId),
                        date: c.date || '', commenter: c.commenter || '',
                        content: c.content || '', replyToName: c.replyToName || '', replyToCommentId: c.replyToCommentId || '',
                        images: imgs,
                        parent: parent ? { itemId: String(parent.weiboId), author: appState.member, date: parent.date || '', content: (parent.content || '').slice(0, 120), url: parent.url || ('https://m.weibo.cn/detail/' + parent.weiboId) } : null
                    };
                }
                async function buildSnapshotByRef(itemType, refId) {
                    if (itemType === 'weibo') { const w = findWeiboById(refId); return w ? await buildWeiboSnapshot(w) : null; }
                    const c = findCommentById(refId); return c ? await buildCommentSnapshot(c) : null;
                }

                // ----- 点赞 -----
                const likeKeyOf = it => itemKeyOf(it.itemType, it.sourceKey, it.itemId);
                function isLiked(itemType, itemId) {
                    const k = itemKeyOf(itemType, currentSourceKey(), String(itemId));
                    return appState.userData.likes.items.some(x => likeKeyOf(x) === k);

                async function toggleLike(itemType, itemId, ev) {
                    if (ev) ev.stopPropagation();
                    if (!appState.currentUser) { showToast('请先登录账号', 'warning'); appState.authStep = 2; return; }

                        appState.userData.likes.items.unshift(Object.assign({}, snap, { likedAt: nowStr() }));

                    await saveUserDataNow();
                }

                // ----- 收藏夹 -----
                function foldersOfItem(itemType, itemId) {
                    const k = itemKeyOf(itemType, currentSourceKey(), String(itemId));
                    return appState.userData.favorites.folders.filter(f => (f.items || []).some(it => itemKeyOf(it.itemType, it.sourceKey, it.itemId) === k));
                }
                function isFavorited(itemType, itemId) { return foldersOfItem(itemType, itemId).length > 0; }
                function openFavPicker(itemType, itemId, ev) {
                    if (ev) ev.stopPropagation();
                    if (!appState.currentUser) { showToast('请先登录账号', 'warning'); appState.authStep = 2; return; }

                    appState.favPickerVisible = true;

                async function toggleFolderItem(folder) {
                    const t = appState.favPickerTarget;
                    if (!t) return;
                    const k = itemKeyOf(t.itemType, currentSourceKey(), t.itemId);
                    const idx = (folder.items || []).findIndex(it => itemKeyOf(it.itemType, it.sourceKey, it.itemId) === k);

                        if (folder.type !== 'mixed' && folder.type !== t.itemType) {

                        if (!snap) { showToast('未找到该内容', 'warning'); return; }
                        if (!folder.items) folder.items = [];
                        folder.items.unshift(Object.assign({}, snap, { addedAt: nowStr() }));
                        showToast('已收藏到「' + folder.name + '」⭐', 'success');

                function isItemInFolder(folder) {
                    const t = appState.favPickerTarget;
                    if (!t) return false;
                    const k = itemKeyOf(t.itemType, currentSourceKey(), t.itemId);
                    return (folder.items || []).some(it => itemKeyOf(it.itemType, it.sourceKey, it.itemId) === k);
                }
                function openCreateFolder() { appState.folderForm = { id: '', name: '', type: 'mixed' }; appState.folderDialogVisible = true; }
                function openEditFolder(f) { appState.folderForm = { id: f.id, name: f.name, type: f.type }; appState.folderDialogVisible = true; }
                async function saveFolderForm() {
                    const name = appState.folderForm.name.trim();
                    if (!name) { showToast('请输入收藏夹名称', 'warning'); return; }
                    if (appState.folderForm.id) {

                        if (f) {
                            f.name = name; f.type = appState.folderForm.type;
                            if (f.type !== 'mixed') f.items = (f.items || []).filter(it => it.itemType === f.type);
                        }

                    }
                    appState.folderDialogVisible = false;
                    await saveUserDataNow();
                }
                async function deleteFolder(f) {
                    if (f.id === 'default') { showToast('默认收藏夹不可删除', 'warning'); return; }
                    try { await ElementPlus.ElMessageBox.confirm('确定删除收藏夹「' + f.name + '」吗？（收藏的内容本身不会被删除）', '删除收藏夹', { type: 'warning', confirmButtonText: '删除', cancelButtonText: '取消' }); } catch (e) { return; }

                async function removeFolderItem(folder, item) {
                    const k = itemKeyOf(item.itemType, item.sourceKey, item.itemId);
                    const idx = (folder.items || []).findIndex(it => itemKeyOf(it.itemType, it.sourceKey, it.itemId) === k);
                    if (idx >= 0) { folder.items.splice(idx, 1); await saveUserDataNow(); }
                }

                // ----- v4 收藏夹导入 / 导出（.wbfav = zip：data.json + 私有媒体）-----
                // 收集快照引用的全部媒体 ID（图片+视频）
                function collectMediaIds(items) {
                    const ids = { images: {}, videos: {} };
                    (items || []).forEach(it => {
                        (it.images || []).forEach(im => { if (im && im.t === 'id') ids.images[im.mediaId] = 1; });
                        (it.videos || []).forEach(vd => { if (vd && vd.t === 'id') ids.videos[vd.mediaId] = 1; });
                    });
                    return ids;
                }

                async function exportFolder(folder) {
                    if (!window.JSZip) { showToast('JSZip 库未加载，无法导出', 'error'); return; }
                    const loading = ElementPlus.ElLoading.service({ lock: true, text: '正在打包收藏夹（含图片视频）...', background: 'rgba(255,255,255,0.7)' });
                    try {
                        const zip = new JSZip();
                        const payload = {
                            version: '1.1',
                            exportedAt: nowStr(),
                            owner: appState.currentUser ? appState.currentUser.username : '',
                            folder: {
                                name: folder.name,
                                type: folder.type,
                                items: (folder.items || []).map(it => {
                                    const cc = Object.assign({}, it); delete cc._folder; return cc;
                                })
                            }
                        };
                        zip.file('data.json', JSON.stringify(payload, null, 2));

                        const ids = collectMediaIds(folder.items);
                        let imgCount = 0, vidCount = 0;
                        for (const mediaId of Object.keys(ids.images)) {
                            try {
                                const blob = await IDB.mediaGet(mediaId);
                                if (blob) { zip.folder('fav_images').file(mediaId, blob); imgCount++; }
                            } catch (e) {}
                        }
                        for (const mediaId of Object.keys(ids.videos)) {
                            try {
                                const blob = await IDB.mediaGet(mediaId);
                                if (blob) {
                                    // 视频不二次压缩
                                    zip.folder('fav_videos').file(mediaId, blob, { compression: 'STORE' });
                                    vidCount++;
                                }
                            } catch (e) {}
                        }

                        const blob = await zip.generateAsync({ type: 'blob' }, meta => { loading.setText('正在打包... ' + meta.percent.toFixed(0) + '%'); });
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = '收藏夹_' + folder.name + '_' + nowStr().slice(0, 10) + '.wbfav';
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        setTimeout(() => URL.revokeObjectURL(a.href), 12000);
                        showToast('已导出「' + folder.name + '」：' + (folder.items || []).length + ' 条内容，' + imgCount + ' 张图片，' + vidCount + ' 个视频', 'success');
                    } catch (e) {
                        console.error(e);
                        showToast('导出失败：' + (e.message || e), 'error');
                    } finally { loading.close(); }
                }
                // zip 媒体文件夹 -> IDB（内容哈希自动去重），返回 压缩包内文件名 -> mediaId 映射
                const MIME_BY_EXT = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', bmp: 'image/bmp', mp4: 'video/mp4', mov: 'video/quicktime', webm: 'video/webm' };
                async function importZipMedia(zipFolder) {
                    const map = {}; let count = 0;
                    if (!zipFolder) return { map, count };
                    const jobs = [];
                    zipFolder.forEach((path, entry) => {
                        if (entry.dir) return;
                        jobs.push((async () => {
                            const raw = await entry.async('blob');
                            // 文件名即原 mediaId（可能带 _扩展名 后缀）；按扩展名恢复 MIME
                            const baseName = String(path || entry.name).replace(/^[\s\/]+/, '');
                            const extMatch = baseName.match(/_([a-z0-9]{1,5})$/i);
                            const ext = extMatch ? extMatch[1].toLowerCase() : '';
                            const blob = ext && MIME_BY_EXT[ext] ? new Blob([raw], { type: MIME_BY_EXT[ext] }) : raw;
                            const mediaId = await IDB.mediaBlobPut(blob, ext);
                            // 同时登记完整路径名、相对名和原文件名，保证引用重映射命中
                            map[entry.name] = mediaId;
                            map[baseName] = mediaId;
                            count++;
                        })());
                    });
                    await Promise.all(jobs);
                    return { map, count };
                }

                // 非 Chromium 浏览器用普通文件选择兜底
                function pickFileViaInput(accept) {
                    return new Promise(resolve => {
                        const inp = document.createElement('input');
                        inp.type = 'file';
                        if (accept) inp.accept = accept;
                        inp.style.display = 'none';
                        inp.onchange = () => resolve(inp.files && inp.files[0]);
                        document.body.appendChild(inp);
                        inp.click();
                        setTimeout(() => { if (inp.parentNode && !inp.files) inp.remove(); }, 60000);
                        inp.addEventListener('change', () => setTimeout(() => inp.remove(), 1000));
                    });
                }

                async function importFavoritesFile() {

                            items: (src.items || []).map(it => {

                                n2.images = (it.images || []).map(remapRef);
                                n2.videos = (it.videos || []).map(remapRef);
                                return n2;

                        };
                        appState.userData.favorites.folders.push(folder);
                        await saveUserDataNow();
                        await hydrateSnapshotImages();
                        showToast('已导入「' + name + '」：' + folder.items.length + ' 条内容，' + imgRes.count + ' 张图片，' + vidRes.count + ' 个视频', 'success');

                // ----- v4 整库备份 / 换机恢复（.wbbak = zip：backup.json + 全部 kv 文档 + media/ 全部媒体）-----
                async function exportFullBackup() {
                    if (!window.JSZip) { showToast('JSZip 库未加载，无法备份', 'error'); return; }
                    const loading = ElementPlus.ElLoading.service({ lock: true, text: '正在读取数据...', background: 'rgba(255,255,255,0.7)' });
                    try {
                        const [kvRecords, mediaRecords] = await Promise.all([IDB.kvGetAll(), IDB.mediaGetAll()]);
                        const zip = new JSZip();
                        const payload = {
                            kind: 'weibo_collector_full_backup',
                            version: '1.0',
                            appVersion: '2.0',
                            exportedAt: nowStr(),
                            records: kvRecords.map(r => ({ k: r.k, v: r.v }))
                        };
                        zip.file('backup.json', JSON.stringify(payload));

                        let done = 0;
                        for (const rec of mediaRecords) {
                            const isVideo = (rec.mime || '').startsWith('video/');
                            zip.folder('media').file(rec.id, rec.blob, isVideo ? { compression: 'STORE' } : undefined);
                            done++;
                            if (done % 20 === 0) loading.setText('正在加入媒体文件... ' + done + '/' + mediaRecords.length);
                        }

                        const blob = await zip.generateAsync({ type: 'blob' }, meta => {
                            loading.setText('正在压缩整库备份... ' + meta.percent.toFixed(0) + '%');
                        });

                        // 判断是否手机端（iOS Safari / Android Chrome 移动端）
                        const ua = navigator.userAgent || '';
                        const isMobile = /iPhone|iPad|iPod|Android/i.test(ua);
                        const filename = '微博收藏助手_整库备份_' + nowStr().slice(0, 10) + '.wbbak';
                        const blobUrl = URL.createObjectURL(blob);

                        if (!isMobile) {
                            // 桌面端：自动下载
                            const a = document.createElement('a');
                            a.href = blobUrl;
                            a.download = filename;
                            document.body.appendChild(a);
                            a.click();
                            a.remove();
                            setTimeout(() => URL.revokeObjectURL(a.href), 30000);
                            showToast('整库备份完成：' + kvRecords.length + ' 组数据、' + mediaRecords.length + ' 个媒体文件', 'success');
                        } else {
                            // 手机端：先存 blob，自动触发一次下载（iOS/Android 都能落盘），然后弹 Dialog 告诉用户存哪
                            const a = document.createElement('a');
                            a.href = blobUrl;
                            a.download = filename;
                            document.body.appendChild(a);
                            a.click();
                            a.remove();

                            // 存起来让用户后续可"分享/重下"
                            appState.pendingBackup = { blobUrl, filename };

                            // 延迟弹提示（等下载触发）
                            setTimeout(() => {
                                ElementPlus.ElMessageBox.confirm(
                                    '备份文件「' + filename + '」已触发下载。\n\n' +
                                    '📱 iOS Safari：\n打开「文件」App → 浏览 → 我的 iPhone → 「下载」或「微博收藏助手」\n\n' +
                                    '🤖 Android Chrome：\n打开系统文件管理器 → 内部存储 → 「下载」\n\n' +
                                    '存好后可以换电脑用【换机恢复】导入。',
                                    '整库备份完成（' + kvRecords.length + ' 组数据、' + mediaRecords.length + ' 个媒体）',
                                    {
                                        confirmButtonText: '📤 分享/存到云盘',
                                        cancelButtonText: '我知道了',
                                        type: 'success'
                                    }
                                ).then(async () => {
                                    // 用户点"分享"：优先用 Web Share API（iOS Safari/Android Chrome 都支持）
                                    if (navigator.share && navigator.canShare && navigator.canShare({ files: [new File([blob], filename)] })) {
                                        try {
                                            const file = new File([blob], filename, { type: 'application/zip' });
                                            await navigator.share({ files: [file], title: filename, text: '微博收藏助手整库备份' });
                                        } catch (e) { /* 用户取消 */ }
                                    } else {
                                        // 不支持分享 → 再次下载让用户自己找
                                        const a2 = document.createElement('a');
                                        a2.href = blobUrl;
                                        a2.download = filename;
                                        document.body.appendChild(a2);
                                        a2.click();
                                        a2.remove();
                                        ElementPlus.ElMessage.info('已再次触发下载，请到系统「下载」文件夹查找');
                                    }
                                }).catch(() => {});
                            }, 600);
                        }
                    } catch (e) {
                        console.error(e);
                        showToast('整库备份失败：' + (e.message || e), 'error');
                    } finally { loading.close(); }
                }

                        try { await ElementPlus.ElMessageBox.confirm(

                        showToast('整库恢复完成：' + records.length + ' 组数据、' + done + ' 个媒体文件，即将刷新页面', 'success');

                // ----- v4 导入旧版整理数据（旧工具的「系统数据」文件夹：成员/年份/{weibo,comment}_data.json）-----
                async function walkLegacyDir(dirHandle, base, found) {
                    for await (const entry of dirHandle.values()) {
                        const p = base ? base + '/' + entry.name : entry.name;
                        if (entry.kind === 'directory') {
                            await walkLegacyDir(entry, p, found);
                        } else {
                            found.push({ path: p, handle: entry });
                        }
                    }
                }
                function pickLegacyFolderViaInput() {
                    // 手机端提示：旧版迁移（目录结构）请用电脑端；换机恢复（.wbbak 单文件）可手机操作
                    const inp = document.createElement('input');
                    inp.type = 'file';
                    const supportsDir = 'webkitdirectory' in inp;
                    if (supportsDir) {
                        // 桌面端：webkitdirectory 选文件夹
                        return new Promise(resolve => {
                            inp.webkitdirectory = true;
                            inp.directory = true;
                            inp.style.display = 'none';
                            inp.onchange = () => resolve(inp.files);
                            document.body.appendChild(inp);
                            inp.click();

                        });

                // ===== 统一媒体全屏预览：把图片 + 视频拼成一个 items 数组，点任意缩略图都能打开 =====
                function openMediaPreview(weibo, clickIdx, clickType) {
                    const items = [];
                    (weibo.images || []).forEach((img, i) => {
                        const url = getImageUrl(img);
                        if (url) items.push({ type: 'image', url, idx: i, kind: 'weiboImage', weiboId: weibo.weiboId });
                    });
                    (weibo.videos || []).forEach((v, i) => {
                        let url = getVideoUrl(v);
                        if (!url && v) {
                            const mi = v.media_info || (typeof v === 'object' && v);
                            if (mi) url = mi.stream_url_hd || mi.stream_url || v.url || v.blobUrl || '';
                        }
                        if (url) items.push({ type: 'video', url, idx: i, kind: 'weiboVideo', weiboId: weibo.weiboId });
                    });
                    if (!items.length) return;
                    // 找到点击项在合并列表里的位置
                    let pos = 0;
                    if (clickType === 'image') {
                        // 找 images 数组里第 clickIdx 个非空图片
                        let c = 0;
                        for (let i = 0; i < items.length; i++) {
                            if (items[i].type === 'image') {
                                if (c === clickIdx) { pos = i; break; }
                                c++;
                            }
                        }
                    } else {
                        let c = 0;
                        for (let i = 0; i < items.length; i++) {
                            if (items[i].type === 'video') {
                                if (c === clickIdx) { pos = i; break; }
                                c++;
                            }
                        }
                    }
                    appState.mediaPreview.items = items;
                    appState.mediaPreview.index = pos;
                    appState.mediaPreview.visible = true;
                }
                function closeMediaPreview() { appState.mediaPreview.visible = false; }
                function prevMedia() {
                    const p = appState.mediaPreview;
                    p.prevIdx = p.index;
                    p.index = (p.index - 1 + p.items.length) % p.items.length;
                }
                function nextMedia() {
                    const p = appState.mediaPreview;
                    p.prevIdx = p.index;
                    p.index = (p.index + 1) % p.items.length;
                }

                // 旧数据中个别评论缺少评论ID：按内容生成确定性ID，保证重复导入不重复
                function legacyFallbackCommentId(raw) {
                    const base = String(raw.weiboId || 'nw') + '|' + String(raw.commenter || '') + '|' + String(raw.date || '') + '|' + String(raw.content || '');
                    let h = 5381;
                    for (let i = 0; i < base.length; i++) h = ((h << 5) + h + base.charCodeAt(i)) >>> 0;
                    return 'cmt_lg_' + String(raw.weiboId || 'x').slice(-10) + '_' + h.toString(36);
                }

                // ===== 旧版 Excel 原始表解析（成员微博整理 / 评论数据）=====
                function legacySplitMediaCell(v) {
                    if (v == null || v === '') return [];
                    return String(v).split(/\s*[|，,]\s*/).map(s => s.trim()).filter(Boolean);
                }
                function legacyExtractWeiboId(link) {
                    const m = String(link || '').match(/\/(\d{10,})/);
                    return m ? m[1] : '';
                }
                function legacyWeiboFallbackId(date, content) {
                    const base = 'w|' + String(date || '') + '|' + String(content || '');
                    let h = 5381;
                    for (let i = 0; i < base.length; i++) h = ((h << 5) + h + base.charCodeAt(i)) >>> 0;
                    return 'w_lg_' + h.toString(36);
                }
                function legacyXlsxDate(v) {
                    if (v == null || v === '') return '';
                    if (typeof v === 'number' && v > 1000 && v < 60000) {
                        const d = new Date(Math.round((v - 25569) * 86400000));
                        if (!isNaN(d.getTime())) return d.toISOString().slice(0, 10);
                    }
                    return normalizeDate(String(v));
                }
                // 单元格里的一个媒体取值：远程 URL -> {url}；本地相对路径 -> {__local: 路径}
                function legacyCellMediaRef(v) {
                    const s = String(v || '').trim();
                    if (!s || /^(none|null|video|-)$/i.test(s)) return null;
                    if (/^https?:\/\//i.test(s)) return { url: s };
                    return { __local: s };
                }
                function legacyIsVideoRef(ref) {
                    return !!(ref && ref.url && /video\.weibocdn|\.mp4($|\?)/i.test(ref.url));
                }
                async function parseXlsxRowsFromFile(file) {
                    const buf = await file.arrayBuffer();
                    const wb = XLSX.read(buf, { type: 'array' });
                    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                }
                async function parseXlsxRowsFromHandle(h) {
                    return parseXlsxRowsFromFile(await h.getFile());
                }
                async function legacyFindSubDir(dirHandle, sub) {
                    if (dirHandle.name === sub) return dirHandle;
                    try { return await dirHandle.getDirectoryHandle(sub, { create: false }); } catch (e) { return null; }
                }
                function legacyEnsureScope(scopes, member, year) {
                    const key = member + '|' + year;
                    if (!scopes.has(key)) {
                        scopes.set(key, { member, year, weibos: [], comments: [], _seenW: new Set(), _seenC: new Set() });
                    }
                    return scopes.get(key);
                }
                function legacySeenInit(sc) {
                    sc.weibos.forEach(w => sc._seenW.add(String(w.weiboId || '').trim()));
                    sc.comments.forEach(c => sc._seenC.add(String(c.commentId || legacyFallbackCommentId(c)).trim()));
                }
                // 年份目录下的微博表（2020年微博.xlsx 等）
                function processLegacyWeiboRows(rows, member, sc) {
                    let n = 0;
                    for (const row of (rows || [])) {
                        let wid = String(row['微博ID'] ?? row['ID'] ?? row['id'] ?? row['微博编号'] ?? row['post_id'] ?? '').trim();
                        if (!wid || !/^\d+$/.test(wid)) wid = legacyExtractWeiboId(row['微博链接'] || row['链接'] || row['url'] || row['原微博链接']);
                        const date = legacyXlsxDate(row['发帖日期'] ?? row['日期'] ?? row['发布时间'] ?? row['时间'] ?? row['发帖时间']);
                        const content = String(row['微博原文'] ?? row['内容'] ?? row['正文'] ?? row['微博内容'] ?? '').trim();
                        const mediaCell = row['图片'] ?? row['图片链接'] ?? row['配图'] ?? '';
                        const videoCell = row['视频'] ?? row['视频链接'] ?? row['视频地址'] ?? '';
                        if (!wid && !content && !mediaCell) continue;
                        if (!wid) wid = legacyWeiboFallbackId(date, content);
                        if (sc._seenW.has(wid)) continue;
                        sc._seenW.add(wid);
                        const images = [], videos = [];
                        for (const item of legacySplitMediaCell(mediaCell)) {
                            const ref = legacyCellMediaRef(item);
                            if (!ref) continue;
                            if (legacyIsVideoRef(ref)) videos.push(ref); else images.push(ref);
                        }
                        for (const item of legacySplitMediaCell(videoCell)) {
                            const ref = legacyCellMediaRef(item);
                            if (ref) videos.push(ref);
                        }
                        const hasFlag = String(row['是否有图片'] ?? '').trim();
                        sc.weibos.push({
                            weiboId: wid, date, content, images, videos,
                            status: 'normal', tags: [], commentTotal: 0,
                            isImageMissing: images.length === 0 && /[√是✓]/.test(hasFlag)
                        });
                        n++;
                    }
                    return n;
                }
                // 成员微博整理/成员/年份/评论/日期.xlsx（无评论ID、无评论时间列，日期取文件名）
                function processLegacyPerDateCommentRows(rows, fileName, member, sc) {
                    let n = 0;
                    const fd = (String(fileName).match(/(\d{8})/) || [])[1];
                    const fileDate = fd ? fd.slice(0, 4) + '-' + fd.slice(4, 6) + '-' + fd.slice(6, 8) : '';
                    for (const row of (rows || [])) {
                        const wid = legacyExtractWeiboId(row['原微博链接'] || row['微博链接']) || String(row['微博ID'] ?? row['weibo_id'] ?? '').trim();
                        const commenter = String(row['发言者昵称'] ?? row['评论者昵称'] ?? row['评论人'] ?? row['用户名'] ?? row['作者'] ?? '').trim();
                        const content = String(row['内容'] ?? row['评论内容'] ?? row['正文'] ?? '').trim();
                        if (!commenter && !content) continue;
                        const date = legacyXlsxDate(row['评论时间'] ?? row['时间'] ?? row['日期']) || fileDate;
                        const raw0 = { weiboId: wid, commenter, date, content };
                        const cid = String(row['评论ID'] ?? row['comment_id'] ?? '').trim() || legacyFallbackCommentId(raw0);
                        if (sc._seenC.has(cid)) continue;
                        sc._seenC.add(cid);
                        const images = [], videos = [];
                        for (const item of legacySplitMediaCell(row['图片'] ?? row['评论图片'] ?? row['配图'] ?? '')) {
                            const ref = legacyCellMediaRef(item);
                            if (!ref) continue;
                            if (legacyIsVideoRef(ref)) videos.push(ref); else images.push(ref);
                        }
                        const typeFlag = String(row['发言者类型'] ?? '');
                        sc.comments.push({
                            weiboId: String(wid || ''), commentId: cid, commenter, date, content,
                            images, videos,
                            type: typeFlag.includes('成员') || commenter === member ? 'memberComment' : 'fanComment',
                            replyToName: String(row['被回复者昵称'] ?? row['回复对象'] ?? '').trim(),
                            replyToCommentId: String(row['被回复评论ID'] ?? row['reply_to'] ?? '').trim(),
                            tags: []
                        });
                        n++;
                    }
                    return n;
                }
                // 评论数据/成员/年份/微博ID.xlsx（信息最全：评论ID、回复关系）
                function processLegacyPerWeiboCommentRows(rows, fileName, member, sc) {
                    let n = 0;
                    const fileWid = String(fileName).replace(/\.xlsx$/i, '').trim();
                    for (const row of (rows || [])) {
                        const wid = String(row['微博ID'] ?? row['weibo_id'] ?? '').trim() || (/^\d+$/.test(fileWid) ? fileWid : '');
                        const commenter = String(row['评论者昵称'] ?? row['评论人'] ?? row['用户名'] ?? row['作者'] ?? '').trim();
                        const content = String(row['评论内容'] ?? row['内容'] ?? row['正文'] ?? '').trim();
                        if (!commenter && !content) continue;
                        const date = legacyXlsxDate(row['评论时间'] ?? row['日期'] ?? row['发布时间'] ?? row['时间']);
                        const raw0 = { weiboId: wid, commenter, date, content };
                        const cid = String(row['评论ID'] ?? row['comment_id'] ?? row['评论者ID'] ?? '').trim() || legacyFallbackCommentId(raw0);
                        if (!wid || sc._seenC.has(cid)) continue;
                        sc._seenC.add(cid);
                        const images = [], videos = [];
                        for (const item of legacySplitMediaCell(row['评论图片'] ?? row['图片'] ?? row['配图'] ?? '')) {
                            const ref = legacyCellMediaRef(item);
                            if (!ref) continue;
                            if (legacyIsVideoRef(ref)) videos.push(ref); else images.push(ref);
                        }
                        sc.comments.push({
                            weiboId: wid, commentId: cid, commenter, date, content,
                            images, videos,
                            type: commenter === member ? 'memberComment' : 'fanComment',
                            replyToName: String(row['被回复者昵称'] ?? row['回复对象'] ?? '').trim(),
                            replyToCommentId: String(row['被回复评论ID'] ?? row['reply_to'] ?? '').trim(),
                            tags: []
                        });
                        n++;
                    }
                    return n;
                }
                // 扫描目录句柄下的 xlsx 原始数据（成员微博整理 / 评论数据，或选中目录本身）
                async function collectLegacyXlsxFromHandles(dirHandle, scopes, stat) {
                    const yearHandleMap = new Map();
                    const scanWeiboRoot = async (wbRoot) => {
                        for await (const m of wbRoot.values()) {
                            if (m.kind !== 'directory') continue;
                            for await (const y of m.values()) {
                                if (y.kind !== 'directory' || !/^\d{4}$/.test(y.name)) continue;
                                yearHandleMap.set(m.name + '|' + y.name, y);
                                const sc = legacyEnsureScope(scopes, m.name, y.name);
                                const cDir = await legacyFindSubDir(y, '评论');
                                for await (const f of y.values()) {
                                    if (f.kind !== 'file' || !/\.xlsx$/i.test(f.name) || f.name.startsWith('~$')) continue;
                                    try {
                                        const rows = await parseXlsxRowsFromHandle(f);
                                        if (processLegacyWeiboRows(rows, m.name, sc)) stat.weiboFiles++;
                                    } catch (e) { console.warn('微博表解析失败:', f.name, e); }
                                }
                                if (cDir) {
                                    for await (const f of cDir.values()) {
                                        if (f.kind !== 'file' || !/\.xlsx$/i.test(f.name) || f.name.startsWith('~$')) continue;
                                        try {
                                            const rows = await parseXlsxRowsFromHandle(f);
                                            if (processLegacyPerDateCommentRows(rows, f.name, m.name, sc)) stat.perDateFiles++;
                                        } catch (e) { console.warn('评论表解析失败:', f.name, e); }
                                    }
                                }
                            }
                        }
                    };
                    const scanCommentRoot = async (cRoot) => {
                        for await (const m of cRoot.values()) {
                            if (m.kind !== 'directory') continue;
                            for await (const y of m.values()) {
                                if (y.kind !== 'directory' || !/^\d{4}$/.test(y.name)) continue;
                                if (!yearHandleMap.has(m.name + '|' + y.name)) yearHandleMap.set(m.name + '|' + y.name, y);
                                const sc = legacyEnsureScope(scopes, m.name, y.name);
                                for await (const f of y.values()) {
                                    if (f.kind !== 'file' || !/\.xlsx$/i.test(f.name) || f.name.startsWith('~$')) continue;
                                    try {
                                        const rows = await parseXlsxRowsFromHandle(f);
                                        if (processLegacyPerWeiboCommentRows(rows, f.name, m.name, sc)) stat.commentFiles++;
                                    } catch (e) { console.warn('评论数据解析失败:', f.name, e); }
                                }
                            }
                        }
                    };
                    const wbRoot = await legacyFindSubDir(dirHandle, '成员微博整理');
                    if (wbRoot) await scanWeiboRoot(wbRoot);
                    const cRoot = await legacyFindSubDir(dirHandle, '评论数据');
                    if (cRoot) await scanCommentRoot(cRoot);
                    return yearHandleMap;
                }
                // webkitdirectory 模式：从文件相对路径里识别 xlsx 原始数据
                async function collectLegacyXlsxFromFiles(pathMap, scopes, stat) {
                    const groups = new Map(); // member|year -> {weibo:[], perDate:[], perWeibo:[]}
                    for (const [rp, file] of pathMap) {
                        if (!/\.xlsx$/i.test(rp) || rp.split('/').pop().startsWith('~$')) continue;
                        let m = rp.match(/^成员微博整理\/([^/]+)\/(\d{4})\/([^/]+\.xlsx)$/);
                        if (m && !/^评论\//.test(m[3])) { pushTo(m[1], m[2], 'weibo', file); continue; }
                        m = rp.match(/^成员微博整理\/([^/]+)\/(\d{4})\/评论\/([^/]+\.xlsx)$/);
                        if (m) { pushTo(m[1], m[2], 'perDate', file); continue; }
                        m = rp.match(/^评论数据\/([^/]+)\/(\d{4})\/([^/]+\.xlsx)$/);
                        if (m) { pushTo(m[1], m[2], 'perWeibo', file); continue; }
                    }
                    function pushTo(member, year, kind, file) {
                        const key = member + '|' + year;
                        if (!groups.has(key)) groups.set(key, { member, year, weibo: [], perDate: [], perWeibo: [] });
                        groups.get(key)[kind].push(file);
                    }
                    for (const g of groups.values()) {
                        const sc = legacyEnsureScope(scopes, g.member, g.year);
                        for (const f of g.weibo) {
                            try { if (processLegacyWeiboRows(await parseXlsxRowsFromFile(f), g.member, sc)) stat.weiboFiles++; } catch (e) {}
                        }
                        for (const f of g.perDate) {
                            try { if (processLegacyPerDateCommentRows(await parseXlsxRowsFromFile(f), f.name, g.member, sc)) stat.perDateFiles++; } catch (e) {}
                        }
                        for (const f of g.perWeibo) {
                            try { if (processLegacyPerWeiboCommentRows(await parseXlsxRowsFromFile(f), f.name, g.member, sc)) stat.commentFiles++; } catch (e) {}
                        }
                    }
                }
                // 本地相对路径 -> File（优先年份目录，其次选中根目录；精确找不到时按"去连字符"模糊匹配，如 2025-12-21.JPG -> 20251221.JPG）
                function makeLegacyResolver(dirHandle, yearHandleMap, pathMap) {
                    const norm = (s) => String(s).replace(/[-_\s]/g, '').toLowerCase();
                    const byHandles = async (member, year, relPath) => {
                        const p = relPath.replace(/\\/g, '/').replace(/^\/+/, '');
                        const segs = p.split('/').filter(Boolean);
                        if (!segs.length) return null;
                        const bases = [];
                        const yh = yearHandleMap && yearHandleMap.get(member + '|' + year);
                        if (yh) bases.push(yh);
                        if (dirHandle) bases.push(dirHandle);
                        for (const base of bases) {
                            try {
                                let cur = base;
                                let ok = true;
                                for (let i = 0; i < segs.length - 1; i++) {
                                    try { cur = await cur.getDirectoryHandle(segs[i]); } catch (e) { ok = false; break; }
                                }
                                if (!ok) continue;
                                try { return await (await cur.getFileHandle(segs[segs.length - 1])).getFile(); } catch (e) {}
                                // 模糊匹配：目标目录里去掉 -/_ 后唯一的同名文件
                                const target = norm(segs[segs.length - 1]);
                                if (!target) continue;
                                let hit = null, hits = 0;
                                for await (const ent of cur.values()) {
                                    if (ent.kind !== 'file') continue;
                                    if (norm(ent.name) === target) { hit = ent; hits++; }
                                }
                                if (hit && hits === 1) return await hit.getFile();
                            } catch (e) {}
                        }
                        return null;
                    };
                    const byFiles = async (member, year, relPath) => {
                        const p = relPath.replace(/\\/g, '/').replace(/^\/+/, '');
                        const cands = ['成员微博整理/' + member + '/' + year + '/' + p, '评论数据/' + member + '/' + year + '/' + p, p, member + '/' + year + '/' + p];
                        for (const c of cands) { const f = pathMap.get(c); if (f) return f; }
                        const parent = p.split('/').slice(0, -1).join('/');
                        const target = norm(p.split('/').pop());
                        if (!target) return null;
                        const prefixes = ['成员微博整理/' + member + '/' + year + '/', '评论数据/' + member + '/' + year + '/', ''];
                        for (const pre of prefixes) {
                            let hit = null, hits = 0;
                            for (const [k, f] of pathMap) {
                                if (!k.startsWith(pre)) continue;
                                const rel = k.slice(pre.length);
                                if (rel.split('/').slice(0, -1).join('/') !== parent) continue;
                                if (norm(rel.split('/').pop()) === target) { hit = f; hits++; }
                            }
                            if (hit && hits === 1) return hit;
                        }
                        return null;
                    };
                    return (dirHandle ? byHandles : byFiles);
                }
                // 导入循环里把媒体引用列表转成存储引用（本地文件入库、URL 原样保留）
                async function importLegacyMediaRefs(refs, resolveLocal, member, year) {
                    const out = [];
                    let local = 0;
                    for (const im of (refs || [])) {
                        try {
                            if (im && im.__local) {
                                const f = await resolveLocal(member, year, im.__local);
                                if (f) { out.push({ mediaId: await IDB.mediaBlobPut(f) }); local++; }
                            } else {
                                const p = await persistMediaRef(im);
                                if (p) { out.push(p); if (p.mediaId) local++; }
                            }
                        } catch (e) {}
                    }
                    return { list: out, local };
                }

                async function importLegacyData() {
                    const loading = ElementPlus.ElLoading.service({ lock: true, text: '正在扫描文件夹...', background: 'rgba(255,255,255,0.7)' });
                    try {
                        // 收集数据源：①「系统数据」JSON 成果 ②「成员微博整理」「评论数据」Excel 原始表
                        const docs = [];
                        let dirHandle = null;
                        const pathMap = new Map(); // webkitdirectory 模式：相对路径 -> File
                        if (window.showDirectoryPicker) {
                            try {
                                dirHandle = await window.showDirectoryPicker({ id: 'legacy_sysdata_import' });
                            } catch (e2) {
                                if (e2 && e2.name === 'AbortError') return;
                                dirHandle = null;
                            }
                        }
                        if (dirHandle) {
                            const found = [];
                            await walkLegacyDir(dirHandle, '', found);
                            for (const f of found) {
                                if (!/^(weibo|comment)_data\.json$/.test(f.handle.name)) continue;
                                const file = await f.handle.getFile();
                                docs.push({ path: f.path, kind: f.handle.name.startsWith('weibo') ? 'w' : 'c', text: await file.text() });

                        } else {
                            const files = await pickLegacyFolderViaInput();
                            if (!files || !files.length) return;
                            // 普通文件选择（无目录）下，从文件名推断成员/年份/路径
                            const nameMap = new Map();
                            for (const file of Array.from(files)) {
                                const base = file.name;
                                let rp = String(file.webkitRelativePath || '').replace(/\\/g, '/').trim();
                                if (!rp) {
                                    // 从文件名推断路径：尝试匹配 "成员名/年份/xxx" 结构
                                    // 旧数据常见命名：{成员名}{年份}/{文件名}.json 或 {成员名}_{年份}_{文件名}.json
                                    const m1 = base.match(/^(.+?)[-_\s](\d{4})[-_\s]*(.+)$/);
                                    if (m1) {
                                        rp = `${m1[1]}/${m1[2]}/${m1[3]}`;
                                    } else {
                                        // 只有文件名：放到根下，后续尽量识别
                                        rp = base;
                                    }
                                } else {
                                    rp = rp.split('/').slice(1).join('/');
                                }
                                if (!rp) continue;
                                pathMap.set(rp, file);
                                nameMap.set(base, file);
                                // 图片/视频也放到 pathMap，让后续 resolveLocal 能找到
                                if (!rp.includes('/') && file.type.startsWith('image/')) pathMap.set('images/' + base, file);
                                else if (!rp.includes('/') && file.type.startsWith('video/')) pathMap.set('videos/' + base, file);
                                if (/^(weibo|comment)_data\.json$/.test(rp.split('/').pop()) ||
                                    /^成员微博整理.*\.(xlsx|xls)$/.test(base) ||
                                    /^评论数据.*\.(xlsx|xls)$/.test(base)) {
                                    if (rp.endsWith('.json')) {
                                        docs.push({ path: rp, kind: rp.split('/').pop().startsWith('weibo') ? 'w' : 'c', text: await file.text() });
                                    } else {
                                        // xlsx 暂不处理（需要目录结构定位成员/年份），提示用户用电脑端导入
                                    }
                                }
                            }
                            // 把 pathMap 也挂到 nameMap 上，作为 resolveLocal 的兜底
                            pathMap.__nameMap = nameMap;
                        }

                        // 路径末三段：成员 / 年份 / 文件名；聚合到作用域
                        const scopes = new Map();
                        const badPaths = [];
                        for (const d of docs) {
                            const parts = String(d.path).replace(/\\/g, '/').split('/');
                            const year = parts[parts.length - 2];
                            const member = parts[parts.length - 3];
                            if (!member || member === '全局用户' || !/^\d{4}$/.test(year)) { badPaths.push(d.path); continue; }
                            const sc = legacyEnsureScope(scopes, member, year);
                            let parsed;
                            try { parsed = JSON.parse(d.text); } catch (e3) { badPaths.push(d.path + '（JSON 无法解析）'); continue; }
                            const rows = (parsed && Array.isArray(parsed.data)) ? parsed.data : [];
                            if (d.kind === 'w') sc.weibos.push(...rows); else sc.comments.push(...rows);

                // ===== IndexedDB 持久化 FileSystemDirectoryHandle =====
                const DB_NAME = 'weibo_dir_handle_db';
                const DB_STORE = 'handles';
                const DB_KEY = 'root_dir';

                function openDirDB() {
                    return new Promise((resolve, reject) => {
                        const req = indexedDB.open(DB_NAME, 1);
                        req.onupgradeneeded = () => {
                            const db = req.result;
                            if (!db.objectStoreNames.contains(DB_STORE)) {
                                db.createObjectStore(DB_STORE);
                            }
                        };
                        req.onsuccess = () => resolve(req.result);
                        req.onerror = () => reject(req.error);
                    });
                }

                async function saveDirHandle(handle) {
                    try {
                        const db = await openDirDB();
                        await new Promise((resolve, reject) => {
                            const tx = db.transaction(DB_STORE, 'readwrite');
                            tx.objectStore(DB_STORE).put(handle, DB_KEY);
                            tx.oncomplete = resolve;
                            tx.onerror = () => reject(tx.error);
                        });
                    } catch (e) {
                        console.warn('保存目录句柄到 IndexedDB 失败:', e);
                    }
                }

                async function loadDirHandle() {
                    try {
                        const db = await openDirDB();
                        return await new Promise((resolve, reject) => {
                            const tx = db.transaction(DB_STORE, 'readonly');
                            const req = tx.objectStore(DB_STORE).get(DB_KEY);
                            req.onsuccess = () => resolve(req.result || null);
                            req.onerror = () => reject(req.error);
                        });
                    } catch (e) {
                        console.warn('从 IndexedDB 加载目录句柄失败:', e);
                        return null;
                    }
                }

                            tx.oncomplete = resolve;

                const crawlForm = reactive({

                // 微博链接 → 唯一标识（数字 mid 或字母 bid）；同步解析，t.cn 短链需另走 resolveWeiboShort
                const WEIBO_BID_RE = /^[A-Za-z][A-Za-z0-9]{8,15}$/;
                const extractWeiboToken = (raw) => {
                    const s = String(raw || '').trim();
                    if (!s) return '';
                    if (/^\d{6,}$/.test(s)) return s;          // 直接粘贴了数字 ID
                    let u;
                    try { u = new URL(/^[a-z]+:\/\//i.test(s) ? s : 'https://' + s); } catch (e) { return ''; }
                    const host = u.hostname.toLowerCase().replace(/^www\./, '');
                    const q = (k) => u.searchParams.get(k) || '';
                    const segs = u.pathname.split('/').map(x => { try { return decodeURIComponent(x); } catch (e) { return x; } }).filter(Boolean);
                    // 各端分享链接常见查询参数（专栏 ttarticle 的 id 不是微博正文，需排除）
                    const qid = q('weibo_id') || q('mid') || q('id') || q('status_id');
                    if (/^\d{6,}$/.test(qid) && !(host === 'weibo.com' && segs.includes('ttarticle'))) return qid;
                    const pick = (x) => (/^\d{6,}$/.test(x) || WEIBO_BID_RE.test(x)) ? x : '';
                    if (host === 'm.weibo.cn') {
                        // 个人主页路径不是微博正文
                        if (segs[0] === 'u' || segs[0] === 'profile' || segs[0] === 'n') return '';
                        const i = segs.findIndex(x => x === 'detail' || x === 'status' || x === 'statuses');
                        if (i >= 0 && segs[i + 1]) return pick(segs[i + 1]);
                        // m 端裸链：/<数字ID 或 bid>
                        const top = segs[0];
                        return top ? pick(top) : '';
                    }
                    if (host === 'weibo.com') {
                        if (segs[0] === 'ttarticle') return '';
                        const i = segs.indexOf('detail');
                        if (i >= 0 && segs[i + 1]) return pick(segs[i + 1]);
                        // /<用户uid>/<mid 或 bid>；u、p 等主页路径不是微博正文
                        if (/^\d{6,}$/.test(segs[0]) && segs[1]) return pick(segs[1]);
                        return '';
                    }
                    if (host === 'weibo.cn') {
                        const i = segs.findIndex(x => x === 'comment' || x === 'repost' || x === 'attitude');
                        if (i >= 0 && segs[i + 1]) return pick(segs[i + 1]);
                        const last = segs[segs.length - 1];
                        return last ? pick(last) : '';
                    }
                    if (/\.weibo\.cn$/.test(host)) {
                        // 国际版/其他子域分享链接：优先查询参数（已处理），其次末段
                        const last = segs[segs.length - 1];
                        return last ? pick(last) : '';
                    }
                    return '';
                };
                const isWeiboShortLink = (raw) => /^https?:\/\/t\.cn\/[A-Za-z0-9]+/i.test(String(raw || '').trim());
                const resolveWeiboShort = async (raw) => {

                        return (j && j.url) ? extractWeiboToken(j.url) : '';

                const parseWeiboUrl = async () => {

                // ===== 链接收藏：自动抓取正文/图片 + 失效检测 =====
                // 检测通道（自动择优）：① 油猴桥 window.__WB_BRIDGE（跨平台·零依赖） ② HTTP 外链代理 mediaProxy
                const LINK_CHECK_TTL = 7 * 24 * 3600 * 1000;
                const weiboLinkOf = (w) => w.url || ((/^\d+$/.test(String(w.weiboId)) ? 'https://m.weibo.cn/detail/' : 'https://m.weibo.cn/status/') + w.weiboId);
                const bridgeAvailable = () => !!(window.__WB_BRIDGE && typeof window.__WB_BRIDGE.check === 'function');
                // 获取微博完整 status：{ ok, exists, data }
                const fetchWeiboStatus = async (id) => {
                    if (!id) return { ok: false };
                    // ① 油猴桥（Tampermonkey 用户脚本注入，浏览器直接走访客接口）
                    if (bridgeAvailable()) {
                        try {
                            const r = await window.__WB_BRIDGE.check(String(id));
                            if (r && typeof r.ok === 'boolean') return r;
                        } catch (e) {}
                    }
                    // ② HTTP 代理（本地 weibo_proxy.py 或云端 Worker）
                    const base = (appState.mediaProxy || '').trim();
                    if (!base) return { ok: false };
                    try {
                        const r = await fetch(base + (base.includes('?') ? '&' : '?') + 'check=' + encodeURIComponent(id));
                        if (!r.ok) return { ok: false };
                        return await r.json();
                    } catch (e) { return { ok: false }; }
                };
                const weiboIdFromInput = (urlOrWeibo) => {
                    if (urlOrWeibo && typeof urlOrWeibo === 'object') return String(urlOrWeibo.weiboId || '');
                    return extractWeiboToken(urlOrWeibo);
                };
                // 微博正文 HTML → 纯文本（保留 #话题#、@用户、[表情]）
                const weiboHtmlToText = (html) => {
                    if (!html) return '';
                    let s = String(html);
                    s = s.replace(/<span[^>]*style=["'][^"']*display\s*:\s*none[^"']*["'][^>]*>[\s\S]*?<\/span>/gi, '');
                    s = s.replace(/<span[^>]*class=["'][^"']*url-icon[^"']*["'][^>]*>\s*<img[^>]*\balt=["']([^"']*)["'][^>]*>[\s\S]*?<\/span>/gi,
                        (m, alt) => alt || '');
                    s = s.replace(/<span[^>]*class=["'][^"']*url-icon[^"']*["'][^>]*>[\s\S]*?<\/span>/gi, '');
                    s = s.replace(/<br\s*\/?>/gi, '\n');
                    s = s.replace(/<a\b[^>]*>([\s\S]*?)<\/a>/gi, (m, t) => t);
                    s = s.replace(/<[^>]+>/g, '');
                    s = s.replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
                         .replace(/&quot;/g, '"').replace(/&#39;/g, "'");
                    return s.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
                };
                const checkWeiboLink = async (urlOrWeibo) => {
                    const id = weiboIdFromInput(urlOrWeibo);
                    if (!id) return 'unknown';
                    const j = await fetchWeiboStatus(id);
                    if (j && j.ok) return j.exists ? 'alive' : 'dead';
                    return 'unknown';
                };
                const linkCheckingIds = ref([]);
                const openWeiboLink = (w) => { window.open(weiboLinkOf(w), '_blank', 'noopener'); };
                const handleCheckLink = async (w, silent) => {
                    const wid = String(w.weiboId);
                    if (linkCheckingIds.value.includes(wid)) return;
                    linkCheckingIds.value.push(wid);
                    const s = await checkWeiboLink(w);
                    w.linkStatus = s;
                    w.linkCheckedAt = nowStr();
                    const i = linkCheckingIds.value.indexOf(wid);
                    if (i > -1) linkCheckingIds.value.splice(i, 1);
                    await saveAllData();
                    if (!silent) {
                        let msg, type;
                        if (s === 'alive') { msg = '✓ 链接正常'; type = 'success'; }
                        else if (s === 'dead') { msg = '⚠️ 该链接已失效'; type = 'error'; }
                        else if (!appState.mediaProxy && !bridgeAvailable()) { msg = '自动检测暂不可用（内置通道未启用），可稍后重试或联系作者'; type = 'warning'; }
                        else { msg = '无法确定链接状态（通道异常或网络受限，可稍后重试）'; type = 'warning'; }
                        showToast(msg, type);
                    }
                    return s;
                };
                const batchLinkChecking = ref(false);
                const handleBatchCheckLinks = async () => {
                    if (batchLinkChecking.value) return;
                    const now = Date.now();
                    const targets = scopeWeibos.value.filter(w => w.entryMode === 'link' && (w.linkStatus !== 'alive' || !w.linkCheckedAt || (now - new Date(w.linkCheckedAt).getTime() > LINK_CHECK_TTL)));
                    if (!targets.length) { showToast('当前列表没有需要检测的链接（链接正常且 7 天内检测过）', 'info'); return; }
                    batchLinkChecking.value = true;
                    let alive = 0, dead = 0, unknown = 0;
                    try {
                        for (const w of targets) {
                            const s = await handleCheckLink(w, true);
                            if (s === 'alive') alive++; else if (s === 'dead') dead++; else unknown++;
                        }
                    } finally { batchLinkChecking.value = false; }
                    showToast('检测完成：' + targets.length + ' 条链接，正常 ' + alive + '、失效 ' + dead + (unknown ? '、无法确定 ' + unknown : ''), dead ? 'error' : 'success');
                };
                // ===== 链接模式提交 + 风险提示文案 =====
                const LINK_RISK_TEXT = [
                    '「只存链接」模式会通过你的代理自动抓取微博正文和图片来预览，你只需粘贴链接。请注意：',
                    '1. 抓取需联网经你的代理进行；微博被作者删除、被平台屏蔽或账号注销后将无法抓取，内容无法找回；',
                    '2. 抓回的正文文字会缓存到本机；但图片本身仍在微博服务器上（以外链形式通过代理显示），链接一旦失效图片可能无法显示；',
                    '3. 微博改版、调整接口规则也可能导致抓取失败；',
                    '4. 重要微博建议改用「完整保存」模式并把图片上传入库，永久保存在本机。'
                ].join('\n');
                const handleCrawlLink = async () => {
                    if (!crawlForm.weiboUrl.trim()) { showToast('请输入微博链接', 'warning'); return; }
                    if (!crawlForm.weiboId) await parseWeiboUrl();
                    if (!crawlForm.weiboId) { showToast('无法从链接中提取微博ID，请检查链接格式', 'warning'); return; }
                    if (!appState.linkRiskConfirmed) {
                        try {
                            await ElementPlus.ElMessageBox.confirm(LINK_RISK_TEXT, '⚠️ 链接保存风险提示', {
                                confirmButtonText: '我已知晓风险，继续添加',
                                cancelButtonText: '取消', type: 'warning'
                            });
                        } catch (e) { showToast('已取消添加', 'info'); return; }
                        appState.linkRiskConfirmed = true;
                        await saveUserDataNow();
                    }
                    const existing = appState.weiboData.data.find(w => w.weiboId === crawlForm.weiboId);
                    if (existing) {
                        try {
                            await ElementPlus.ElMessageBox.confirm('该微博已存在，是否仍要重新添加？', '提示', { confirmButtonText: '是', cancelButtonText: '否', type: 'warning' });
                        } catch (e) { return; }
                    }
                    const res = await fetchWeiboStatus(crawlForm.weiboId);
                    const linkStatus = (res && res.ok) ? (res.exists ? 'alive' : 'dead') : 'unknown';
                    let content = '', images = [], videos = [];
                    if (linkStatus === 'alive' && res.data) {
                        content = weiboHtmlToText(res.data.text || '');
                        images = (res.data.pics || [])
                            .map(p => ({ url: ((p.large && p.large.url) || p.url || '') }))
                            .filter(x => x.url);
                        const pi = res.data.page_info;
                        if (pi && pi.type === 'video') {
                            const mi = pi.media_info || {};
                            const urls = pi.urls || {};
                            const vu = mi.stream_url_hd || mi.stream_url
                                     || urls.mp4_720p_mp4 || urls.mp4_hd_mp4 || urls.mp4_ld_mp4 || '';
                            if (vu) videos = [{ url: vu }];
                        }
                    } else if (existing) {
                        // 本次没抓到：保留旧缓存内容，不被清空
                        content = existing.content || '';
                        images = existing.images || [];
                        videos = existing.videos || [];
                    }
                    const newWeibo = {
                        weiboId: crawlForm.weiboId,
                        localId: null,
                        date: crawlForm.date || formatDateTime(new Date()).split(' ')[0],
                        content, images, videos,
                        status: { isImageConfirmed: false, isContentConfirmed: false, isCompleted: false },
                        tags: [], remark: '', isImageMissing: false,
                        imageConfirm: false, contentConfirm: false, reviewCount: 0,
                        member: appState.member, year: String(appState.year),
                        entryMode: 'link', url: crawlForm.weiboUrl.trim(),
                        linkStatus, linkCheckedAt: nowStr()
                    };
                    if (existing) {
                        const idx = appState.weiboData.data.findIndex(w => w.weiboId === crawlForm.weiboId);
                        appState.weiboData.data[idx] = { ...existing, ...newWeibo };
                    } else {
                        appState.weiboData.data.push(newWeibo);

                    await updateStats();
                    await saveAllData();
                    crawlForm.weiboUrl = ''; crawlForm.weiboId = '';
                    let doneMsg, doneType;
                    if (linkStatus === 'alive') {
                        doneMsg = '已自动抓取正文和 ' + images.length + ' 张图片' + (videos.length ? '、' + videos.length + ' 个视频' : '') + '，②页可预览';
                        doneType = 'success';
                    } else if (linkStatus === 'dead') {
                        doneMsg = '链接已添加，但检测显示该链接已失效，未抓取到内容';
                        doneType = 'error';
                    } else {
                        doneMsg = (appState.mediaProxy || bridgeAvailable()) ? '链接已添加（通道检测失败，可稍后重检）' : '链接已添加（未配置检测通道，未抓取内容）';
                        doneType = 'warning';

                    showToast(doneMsg, doneType);
                };

                const handleCrawlWeibo = async () => {
                    if (crawlForm.mode === 'link') return handleCrawlLink();
                    if (!crawlForm.weiboUrl) {
                        showToast('请输入微博链接', 'warning');
                        return;
                    }
                    
                    if (!crawlForm.weiboId) {
                        parseWeiboUrl();
                    }
                    
                    if (!crawlForm.weiboId) {
                        showToast('无法从链接中提取微博ID，请检查链接格式', 'warning');
                        return;
                    }
                    
                    if (!crawlForm.content.trim()) {
                        showToast('请输入微博内容', 'warning');
                        return;
                    }
                    
                    const existing = appState.weiboData.data.find(w => w.weiboId === crawlForm.weiboId);
                    if (existing) {
                        try {
                            await ElementPlus.ElMessageBox.confirm('该微博已存在，是否重新添加？', '提示', {
                                confirmButtonText: '是',
                                cancelButtonText: '否',
                                type: 'warning'
                            });

                            return;
                        }
                    }
                    
                    const savedImages = [];
                    if (crawlForm.images && crawlForm.images.length > 0) {
                        for (let i = 0; i < crawlForm.images.length; i++) {
                            const img = crawlForm.images[i];
                            if (img.blobUrl) {
                                const byteString = img.blobUrl.split(',')[1];
                                const mimeType = img.blobUrl.split(',')[0].split(':')[1].split(';')[0];
                                const ab = atob(byteString);
                                const ia = new Uint8Array(ab.length);
                                for (let j = 0; j < ab.length; j++) {
                                    ia[j] = ab.charCodeAt(j);

                                const blob = new Blob([ia], { type: mimeType });

                                let fullPath = null;

                                    fullPath = await saveImageToLocal(file, crawlForm.weiboId, crawlForm.date, savedImages.length);

                                savedImages.push({
                                    blobUrl: img.blobUrl,

                    const savedVideos = [];

                            if (video.blobUrl) {
                                const byteString = video.blobUrl.split(',')[1];
                                const mimeType = video.blobUrl.split(',')[0].split(':')[1].split(';')[0];
                                const ab = atob(byteString);
                                const ia = new Uint8Array(ab.length);
                                for (let j = 0; j < ab.length; j++) {
                                    ia[j] = ab.charCodeAt(j);
                                }
                                const blob = new Blob([ia], { type: mimeType });
                                const file = new File([blob], video.fileName, { type: mimeType });

                const groupedComments = computed(() => {

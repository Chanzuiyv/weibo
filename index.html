                    const commentsWithRelations = comments.map(c => ({ ...c }));
                    const commentIdMap = new Map();
                    commentsWithRelations.forEach(c => commentIdMap.set(c.commentId, c));
                    
                    // 构建 commentId -> children 映射
                    const childrenMap = new Map();
                    const rootComments = [];
                    const hasParent = new Set();
                    
                    // 第一轮：基于 replyToCommentId 建立关系（精确匹配）
                    commentsWithRelations.forEach(comment => {
                        const replyId = comment.replyToCommentId;
                        if (replyId && commentIdMap.has(replyId) && replyId !== comment.commentId) {
                            // 验证不形成循环
                            let current = commentIdMap.get(replyId);
                            let hasCycle = false;
                            const visited = new Set([comment.commentId]);
                            while (current && current.replyToCommentId) {
                                if (visited.has(current.replyToCommentId)) { hasCycle = true; break; }
                                visited.add(current.replyToCommentId);
                                current = commentIdMap.get(current.replyToCommentId);
                            }
                            if (!hasCycle) {
                                if (!childrenMap.has(replyId)) childrenMap.set(replyId, []);
                                childrenMap.get(replyId).push(comment);
                                hasParent.add(comment.commentId);
                                return;
                            }
                        }
                        rootComments.push(comment);
                    });
                    
                    // 第二轮：启发式匹配 —— 只处理那些还没有 replyToCommentId 且还没被分配父节点的评论
                    // 这保证向后兼容旧数据，同时不影响新的拖拽建立的精确关系
                    const fanCommentMap = new Map();
                    const memberCommentMap = new Map();
                    const memberCommentNames = new Set();
                    
                    commentsWithRelations.forEach(c => {
                        if (c.type === 'fanComment') fanCommentMap.set(c.commenter, c);
                        if (c.type === 'memberComment') { memberCommentMap.set(c.commenter, c); memberCommentNames.add(c.commenter); }
                    });
                    
                    // 处理还没有父节点的 memberComment，检查 replyToName 或 @昵称
                    commentsWithRelations.forEach(memberComment => {
                        if (memberComment.type !== 'memberComment') return;
                        if (hasParent.has(memberComment.commentId)) return; // 已有精确关系
                        if (memberComment.replyToCommentId) return; // 有精确 id 但可能无效
                        
                        let targetFan = null;
                        if (memberComment.replyToName && fanCommentMap.has(memberComment.replyToName)) {
                            targetFan = fanCommentMap.get(memberComment.replyToName);
                        } else {
                            const match = memberComment.content.match(/@(\S+)/);
                            if (match && fanCommentMap.has(match[1])) {
                                targetFan = fanCommentMap.get(match[1]);
                            }
                        }
                        
                        if (targetFan && targetFan.commentId !== memberComment.commentId && !hasParent.has(targetFan.commentId)) {
                            if (!childrenMap.has(targetFan.commentId)) childrenMap.set(targetFan.commentId, []);
                            childrenMap.get(targetFan.commentId).push(memberComment);
                            hasParent.add(memberComment.commentId);
                            // 从 rootComments 中移除
                            const idx = rootComments.indexOf(memberComment);
                            if (idx >= 0) rootComments.splice(idx, 1);
                        }
                    });
                    
                    // 处理还没有父节点的 fanComment @成员 的情况
                    commentsWithRelations.forEach(fanComment => {
                        if (fanComment.type !== 'fanComment') return;
                        if (hasParent.has(fanComment.commentId)) return;
                        if (fanComment.replyToCommentId) return;
                        
                        const match = fanComment.content.match(/@(\S+)/);

                    return rootComments.map(root => {
                        const buildNode = (comment) => {
                            const children = childrenMap.get(comment.commentId) || [];
                            return {
                                comment: comment,
                                replies: children.map(buildNode)

                        };
                        return buildNode(root);

                    const result = new Map();

                        const childrenMap = new Map(); const roots = []; const hasParent = new Set();

                                if (!childrenMap.has(replyId)) childrenMap.set(replyId, []);
                                childrenMap.get(replyId).push(comment); hasParent.add(comment.commentId);
                            } else roots.push(comment);

                        const buildNode = (cmt) => {

                            kids.sort((a,b) => (a.date||'').localeCompare(b.date||''));

                        roots.sort((a,b) => (a.date||'').localeCompare(b.date||''));

                        // 文件名安全处理 / 日期片段 / 图片解析为 Blob 的统一工具

                            const v = String(s == null ? '' : s).replace(/[\\/:*?"<>|]/g, '_').trim();
                            return v || '未知';
                        };
                        const datePartOf = (d) => (d ? String(d).replace(/-/g, '') : 'nodate');
                        const resolveImageBlob = async (img) => {
                            try {
                                if (img && typeof img === 'object') {
                                    if (img.base64) {
                                        const parts = String(img.base64).split(',');
                                        const byteString = atob(parts[1] || '');
                                        const mimeMatch = String(parts[0]).match(/:(.*?);/);
                                        const mimeType = (mimeMatch && mimeMatch[1]) || 'image/jpeg';
                                        const ab = new ArrayBuffer(byteString.length);
                                        const ia = new Uint8Array(ab);
                                        for (let i = 0; i < byteString.length; i++) {
                                            ia[i] = byteString.charCodeAt(i);
                                        }
                                        return new Blob([ab], { type: mimeType });
                                    }
                                    if (img.blobUrl) {
                                        return await (await fetch(img.blobUrl)).blob();
                                    }
                                    if (img.filePath) {
                                        return await (await fetch(img.filePath)).blob();
                                    }
                                }
                                // 字符串形式仅支持 data URI；远程 http 图片受跨域限制不导出
                                if (typeof img === 'string' && img.startsWith('data:')) {
                                    return await (await fetch(img)).blob();
                                }
                            } catch (e) {
                                return null;
                            }
                            return null;

                        const originalDir = await yearDir.getDirectoryHandle('原文', { create: true });

                            const wid = safeFilePart(weibo.weiboId);
                            if (Array.isArray(weibo.images)) {
                                for (let imgIdx = 0; imgIdx < weibo.images.length; imgIdx++) {
                                    const blob = await resolveImageBlob(weibo.images[imgIdx]);

                                        const fh = await originalDir.getFileHandle(fileName, { create: true });

                        const weiboWs = XLSX.utils.json_to_sheet(weiboSheetData);

                        const weiboStatsMap = new Map();
                        appState.weiboData.data.forEach(w => {

                            const memberComments = weiboComments.filter(c => c.type === 'memberComment');
                            const repliedComments = weiboComments.filter(c => c.replyToName && c.replyToName.trim());
                            const imageComments = weiboComments.filter(c => c.images && c.images.length > 0);
                            
                            weiboStatsMap.set(w.weiboId, {
                                date: w.date,
                                url: `https://m.weibo.cn/detail/${w.weiboId}`,
                                memberCount: memberComments.length,
                                repliedCount: repliedComments.length,
                                imageCount: imageComments.length

                        const statsSheetData = Array.from(weiboStatsMap.values()).map(stat => ({
                            '发帖日期': truncateText(stat.date),
                            '原微博链接': truncateText(stat.url),
                            '成员发布总数': stat.memberCount,
                            '被回复评论总数': stat.repliedCount,
                            '带图评论总数': stat.imageCount
                        }));
                        
                        const statsWs = XLSX.utils.json_to_sheet(statsSheetData);
                        XLSX.utils.book_append_sheet(wb, statsWs, '统计汇总');
                        
                        const weiboFile = await yearDir.getFileHandle('微博.xlsx', { create: true });
                        const weiboWritable = await weiboFile.createWritable();
                        await weiboWritable.write(XLSX.write(wb, { type: 'array', bookType: 'xlsx' }));
                        await weiboWritable.close();

                        // ===== 第二步：导出评论表与评论图片 =====
                        // 评论表命名：评论/日期_微博ID.xlsx；评论图片命名：评论图片/日期/昵称_评论ID_序号.JPG
                        // 加微博ID/评论ID/序号后，同一天多条微博或同一评论者多条评论均不会互相覆盖
                        const commentDir = await yearDir.getDirectoryHandle('评论', { create: true });
                        const commentImageDir = await yearDir.getDirectoryHandle('评论图片', { create: true });

                        for (const weibo of appState.weiboData.data) {
                            const weiboComments = appState.commentData.data.filter(c => c.weiboId === weibo.weiboId);
                            if (weiboComments.length === 0) continue;

                            const dateStr = datePartOf(weibo.date);
                            const wid = safeFilePart(weibo.weiboId);
                            const dateImageDir = await commentImageDir.getDirectoryHandle(dateStr, { create: true });

                            const commentSheetData = [];
                            for (const comment of weiboComments) {
                                // 每条评论导出全部可读取的图片（不再只取 images[0]）
                                const imagePaths = [];
                                if (Array.isArray(comment.images)) {
                                    const safeNickname = safeFilePart(comment.commenter || '未知');

                                    for (let imgIdx = 0; imgIdx < comment.images.length; imgIdx++) {

                                        const fileName = `${safeNickname}_${safeCommentId}_${imgIdx + 1}.JPG`;
                                        try {
                                            const fh = await dateImageDir.getFileHandle(fileName, { create: true });
                                            const wr = await fh.createWritable();
                                            await wr.write(await blob.arrayBuffer());
                                            await wr.close();
                                            imagePaths.push(`../评论图片/${dateStr}/${fileName}`);
                                        } catch (e) {
                                            console.warn('评论图片导出失败:', fileName, e);

                                    }
                                }

                                otherTabSeen = true;

                            @node-dragover="(...args) => $emit('node-dragover', ...args)"
                            @node-dragenter="(...args) => $emit('node-dragenter', ...args)"
                            @node-dragleave="(...args) => $emit('node-dragleave', ...args)"
                            @node-drop="(...args) => $emit('node-drop', ...args)"
                            @node-edit="(...args) => $emit('node-edit', ...args)"
                            @node-confirm="(...args) => $emit('node-confirm', ...args)"
                            @node-delete="(...args) => $emit('node-delete', ...args)"
                            @node-detach="(...args) => $emit('node-detach', ...args)"
                            @node-edit-link="(...args) => $emit('node-edit-link', ...args)"
                            @node-goto-edit="(...args) => $emit('node-goto-edit', ...args)"
                        />
                    </div>
                </div>
            `,
            setup(props) {
                const getReplyToName = (comment) => {
                    return comment.replyToName || '(未知)';
                };
                const getImageUrl = (img) => {
                    if (!img) return '';
                    if (typeof img === 'object') {
                        if (img.base64) return img.base64;
                        if (img.blobUrl) return img.blobUrl;
                        if (img.url) return proxifyMediaUrl(img.url);
                    }
                    if (typeof img === 'string') {
                        if (img.startsWith('blob:null')) return '';
                        if (img.includes('sinaimg.cn') && img.endsWith('&690')) return '';
                        if (img.startsWith('http')) return proxifyMediaUrl(img);
                        if (img.startsWith('data:')) return img;
                    }
                    return '';
                };
                return { getReplyToName, getImageUrl };
            }
        });
        
        app.mount('#app');
        
        setTimeout(() => {
            const guideCompleted = localStorage.getItem('weibo_guide_completed');
            if (!guideCompleted) {
                appState.showGuide = true;
                appState.guideStep = 0;
            }
        }, 500);
</script>
</body>
</html>
